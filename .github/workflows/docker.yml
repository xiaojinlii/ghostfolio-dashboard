name: Build and Push Docker Image

on:
  # ============================================================
  # Push to main:
  #   -> build and push :latest
  #
  # Push version tag:
  #   v1.2.3
  #   -> build and push:
  #      :v1.2.3
  #      :1.2.3
  #      :1.2
  #      :1
  #      :latest
  # ============================================================
  push:
    # branches:
    #   - main
    tags:
      - "v*"

  # ============================================================
  # Allow manual trigger from GitHub Actions
  # ============================================================
  workflow_dispatch:

# ==============================================================
# Global environment
# ==============================================================
env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  docker:

    # GitHub-hosted runner
    runs-on: ubuntu-latest

    # Required permissions:
    # contents: read   -> checkout repository
    # packages: write  -> push image to GHCR
    permissions:
      contents: read
      packages: write

    steps:

      # ========================================================
      # 1. Checkout source code
      # ========================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ========================================================
      # 2. Enable Docker Buildx
      # ========================================================
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ========================================================
      # 3. Login to GitHub Container Registry
      # ========================================================
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ========================================================
      # 4. Generate Docker image metadata and tags
      # ========================================================
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

          tags: |
            # --------------------------------------------------
            # main -> latest
            # --------------------------------------------------
            type=raw,value=latest,enable={{is_default_branch}}

            # --------------------------------------------------
            # v1.2.3 -> v1.2.3
            # --------------------------------------------------
            type=ref,event=tag

            # --------------------------------------------------
            # v1.2.3 -> 1.2.3
            # v1.2.3 -> 1.2
            # v1.2.3 -> 1
            # --------------------------------------------------
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

            # --------------------------------------------------
            # Version tag -> latest
            #
            # v1.2.3 -> latest
            # --------------------------------------------------
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

            # --------------------------------------------------
            # Branch builds other than main
            # -> branch-xxx
            # --------------------------------------------------
            type=ref,event=branch

          labels: |
            org.opencontainers.image.title=${{ github.event.repository.name }}
            org.opencontainers.image.description=Ghostfolio Dashboard
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      # ========================================================
      # 5. Build and push Docker image (x86_64 only)
      # ========================================================
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile

          # ----------------------------------------------------
          # Single-platform (默认使用 runner 架构，即 linux/amd64)
          # ----------------------------------------------------
          platforms: linux/amd64

          # ----------------------------------------------------
          # Push to GHCR
          # ----------------------------------------------------
          push: true

          # ----------------------------------------------------
          # Generated tags / labels
          # ----------------------------------------------------
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

          # ----------------------------------------------------
          # GitHub Actions build cache
          # ----------------------------------------------------
          cache-from: type=gha
          cache-to: type=gha,mode=max